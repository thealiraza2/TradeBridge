<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TradeBridge Settings</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border: #243049;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .btn-save {
      background: var(--primary);
      color: #0b0f19;
    }

    .btn-test {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
    }

    #test-status {
      margin-top: 10px;
      font-size: 0.75rem;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }

    .status-ok { color: var(--success); }
    .status-err { color: var(--danger); }

    .security-note {
      margin-top: 14px;
      padding: 8px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 4px;
      font-size: 0.7rem;
      line-height: 1.3;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">TradeBridge One-Click</div>
  </div>

  <form id="settings-form">
    <div class="form-group">
      <label for="webhook_url">Server Webhook URL</label>
      <input type="url" id="webhook_url" placeholder="http://127.0.0.1:8000/webhook" required>
    </div>

    <div class="form-group">
      <label for="webhook_secret">Webhook Secret</label>
      <input type="password" id="webhook_secret" placeholder="Your secret from .env" required>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label for="default_risk_pct">Default Risk %</label>
        <input type="number" id="default_risk_pct" step="0.1" min="0.1" max="5.0" value="1.0" required>
      </div>
      <div class="form-group">
        <label for="default_max_lot">Max Lot</label>
        <input type="number" id="default_max_lot" step="0.01" min="0.01" value="2.0" required>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="btn-test" class="btn-test">Test Connection</button>
      <button type="submit" class="btn-save">Save Settings</button>
    </div>
  </form>

  <div id="test-status"></div>

  <div class="security-note">
    Secret is stored only in your browser. It is never sent anywhere except to your own server.
  </div>

  <script src="popup.js"></script>
</body>
</html>
